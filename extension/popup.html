<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ferrn Capture</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;width:360px;background:#0b0b0c;color:#f7f7f8;font-family:Inter,sans-serif}.wrap{padding:16px}.brand{display:flex;gap:10px;align-items:center;margin-bottom:14px}.logo{width:34px;height:34px;border-radius:10px;background:#ff4100;display:grid;place-items:center;font-weight:800}.brand b{display:block}.brand span{font-size:11px;color:#96969f}.card{background:#151517;border:1px solid #2b2b30;border-radius:14px;padding:12px;margin-bottom:12px}.row{display:flex;gap:8px}.btn{width:100%;border:1px solid #2b2b30;background:#1d1d20;color:#fff;border-radius:10px;padding:10px 12px;font-family:inherit;font-weight:700;cursor:pointer}.btn.primary{background:#ff4100;border-color:#ff4100}.btn.success{background:#2fb36d;border-color:#2fb36d}.input,.select,.textarea{width:100%;border:1px solid #2b2b30;background:#111113;color:#fff;border-radius:10px;padding:10px;font-family:inherit}.field{margin:9px 0}.field label{display:block;font-size:11px;color:#aaa;margin-bottom:5px}.status{font-size:12px;color:#aaa}.ok{color:#71da9d}.hidden{display:none}.metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.metric{background:#101012;border-radius:10px;padding:8px;text-align:center}.metric b{display:block;font-size:18px}.metric span{font-size:9px;color:#92929a}.shot{width:100%;max-height:140px;object-fit:cover;border-radius:10px;border:1px solid #2b2b30;margin-top:8px}</style></head><body><div class="wrap"><div class="brand"><div class="logo">F</div><div><b>Ferrn Capture</b><span>Report bugs with technical context</span></div></div><div class="card"><div id="idle"><div class="status">Start capture before reproducing the issue. Network and console events will be collected automatically.</div><button id="start" class="btn primary" style="margin-top:10px">Start capture</button></div><div id="active" class="hidden"><div class="status ok">● Capturing this tab</div><div class="metrics" style="margin:10px 0"><div class="metric"><b id="mConsole">0</b><span>Console</span></div><div class="metric"><b id="mNetwork">0</b><span>Network</span></div><div class="metric"><b id="mActions">0</b><span>Actions</span></div></div><button id="screenshot" class="btn">Capture screenshot</button><img id="preview" class="shot hidden"><div class="field"><label>Issue title</label><input id="title" class="input" placeholder="e.g. Clock-in fails on submit"></div><div class="field"><label>Description</label><textarea id="description" class="textarea" rows="3" placeholder="What went wrong?"></textarea></div><div class="row"><div class="field" style="flex:1"><label>Priority</label><select id="priority" class="select"><option>low</option><option>medium</option><option selected>high</option><option>critical</option></select></div><div class="field" style="flex:1"><label>Assignee</label><select id="assignee" class="select"><option value="">Unassigned</option></select></div></div><button id="submit" class="btn success">Send to Issue Control</button><button id="stop" class="btn" style="margin-top:7px">Stop without sending</button></div><div id="message" class="status" style="margin-top:8px"></div></div></div><script src="popup.js"></script></body></html>
